<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
        }
        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
        }
        .galeria div {
            width: 220px;
            margin: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .galeria img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Galería de Imágenes</h1>
    <div class="galeria" id="galeria"></div>

    <script>
        // Lista de imágenes dentro de la carpeta "imagenes"
        const imagenes = [
// Añade más imágenes según sea necesario
        'DSC_0048.jpg',
        'DSC_0049.jpg',
        'DSC_0059.jpg',
        'DSC_0089.jpg',
        'DSC_0090.jpg',
        'DSC_0112.jpg',
        'DSC_0116.jpg',
        'DSC_0118.jpg'
        ];

        // Seleccionar el contenedor de la galería
        const galeria = document.getElementById('galeria');

        // Recorrer la lista de imágenes y generar las etiquetas <img>
        imagenes.forEach(function(imagen) {
            const divElement = document.createElement('div'); // Contenedor para cada imagen
            const imgElement = document.createElement('img');
            imgElement.setAttribute('data-src', imagen); // Ruta de imagen diferida
            imgElement.alt = 'Imagen';
            imgElement.classList.add('lazy'); // Añadir clase para identificarlas
            divElement.appendChild(imgElement);
            galeria.appendChild(divElement);
        });

        // Implementar lazy loading con Intersection Observer
        const lazyImages = document.querySelectorAll('.lazy');
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.getAttribute('data-src');
                    img.removeAttribute('data-src'); // Limpieza de atributo
                    observer.unobserve(img); // Dejar de observar esta imagen
                }
            });
        });

        lazyImages.forEach(img => observer.observe(img));
    </script>
</body>
</html>
